<html>
<head>
</head>
<body>

<h2>Basic Calculator</h2>

<input type="number" id="num1" placeholder="Enter value 1">
<input type="number" id="num2" placeholder="Enter value 2">

<button onclick="showFun()">Result</button>

<input type="number" id="result" placeholder="Result will be shown here" readonly>

<script>
    function showFun() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);

        document.getElementById("result").value = a + b;
    }
</script>

</body>
</html>
