<!DOCTYPE html>
<html>
<head>
    <title>Live Text Preview</title>
    <style>
        body {
            text-align: center;
            padding-top: 50px;
            font-family: Arial;
        }

        input {
            padding: 12px;
            width: 250px;
            font-size: 18px;
            border: 2px solid gray;
            border-radius: 8px;
        }

        h2 {
            margin-top: 20px;
            color: darkblue;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <input type="text" id="textInput" placeholder="Type something here...">

    <h2 id="outputText">TEXT WILL APPEAR HERE</h2>


    <script>
        let input = document.getElementById("textInput");
        let output = document.getElementById("outputText");

        input.addEventListener("keyup", function() {
            output.innerText = input.value;
        });
    </script>

</body>
</html>
