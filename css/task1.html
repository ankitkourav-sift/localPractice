<!DOCTYPE html>
<html>
<head>
    <title>Task 2 Output</title>
    <style>

        p {
            font-size: 18px;
            line-height: 1.8;
            text-align: justify;
            font-style: italic;
            word-spacing: 4px;
        }

        /* First line styling */
        p::first-line {
            font-weight: bold;
        }

    </style>
</head>
<body>

    <h1 id="a">Welcome to My Profile</h1>

    <div>
        <p>
            This is a sample paragraph to demonstrate the styling applied to the heading above.
            You can see how the paragraph looks with increased line height, spacing, and justified alignment.
        </p>
    </div>

</body>
</html>
